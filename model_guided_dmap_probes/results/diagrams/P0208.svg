<text x="32" y="1057" fill="#587080" font-size="11" font-weight="400" text-anchor="start">Colored arrows = modeled wire events. Dashed endpoint leg = deliberate TTL expiry. Red = invalid TCP checksum.</text>
<text x="32" y="1077" fill="#587080" font-size="11" font-weight="400" text-anchor="start">No packets sent. Linux behavior is symbolic. All censorship bits and DPI implementation outcomes are unmeasured.</text>
