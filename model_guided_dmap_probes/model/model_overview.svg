<text x="36" y="1035" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53627c" font-weight="400" text-anchor="start">Exact reset can retire an incarnation. Same-tuple reuse preserves closing / TIME_WAIT state until the profile permits reopening.</text>
<text x="36" y="1062" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#53627c" font-weight="400" text-anchor="start">C = N + A + 2W + κT is applied to complete search prefixes; real DPI outcomes and discrimination remain unmeasured.</text>
