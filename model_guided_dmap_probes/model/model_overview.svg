<rect x="1144" y="229" width="5" height="25" rx="2" fill="#8557c5"/>
<text x="1164" y="249" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#25334a" font-weight="700" text-anchor="start">Attacker observation</text>
<text x="1164" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Observe real reply → learn ISN</text>
<text x="1164" y="305" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Deferred reply → pending token</text>
<text x="1164" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Observation is separately fired</text>
<text x="1164" y="355" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Censorship bit Y is unmeasured</text>
