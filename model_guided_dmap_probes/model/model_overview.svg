<text x="333" y="249" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#25334a" font-weight="700" text-anchor="start">Visibility / validation</text>
<text x="333" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">DPI-only → no Linux event</text>
<text x="333" y="305" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Invalid TCP → reject at Linux</text>
<text x="333" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Full + valid → reference TCP</text>
<text x="333" y="355" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">DPI processing stays unknown</text>
