<text x="887" y="249" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#25334a" font-weight="700" text-anchor="start">Ordered wire events</text>
<text x="887" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Attacker send counts in N</text>
<text x="887" y="305" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Forced server sends count in N</text>
<text x="887" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Every send has its own firing</text>
<text x="887" y="355" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Wait / observation ≠ send</text>
