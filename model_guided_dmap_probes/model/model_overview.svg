<text x="610" y="280" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Both flow records retained</text>
<text x="610" y="305" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">No guessed opaque server ISN</text>
<text x="610" y="330" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#25334a" font-weight="400" text-anchor="start">Genuine effects and replies</text>
